[project]
name = "job-market-analytics"
version = "0.2.0"
description = "Job-market ingestion and analytics pipeline (ingestion, dbt transformations, AI relevance scoring)."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "requests>=2.32",
    "duckdb>=1.0",
    "dbt-core>=1.12,<1.13",
    # dbt-core >=1.12 requires this, and it has only ever published pre-releases
    # (2.0.0a5, 2.0.0b2 — there is no stable version to resolve to). Declared as a
    # direct dependency so `prerelease = "explicit"` below admits this one package
    # rather than opening pre-releases across the whole graph, which is how a
    # transitive bump reached the dbt-core 2.0.0b1 placeholder once already.
    "dbt-core-experimental-parser>=2.0.0b1",
    "dbt-duckdb>=1.10,<1.13",
    "dbt-bigquery>=1.10,<1.13",
    "google-cloud-bigquery>=3.25",
    "mashumaro[msgpack]>=3.17",   # newer build is needed for Python 3.14
    "pyyaml>=6.0.3",
]
[tool.uv]
# Not "disallow": that cannot resolve, because dbt-core's own dependency on
# dbt-core-experimental-parser can only ever be satisfied by a pre-release.
# "explicit" limits pre-releases to packages named directly above.
prerelease = "explicit"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.5",
    "mypy>=1.10",
    "sqlfluff>=3.0",
    "pre-commit>=3.7",
    "sqlfluff-templater-dbt>=3.0",
    "types-PyYAML>=6.0.12",
]

# ruff is the single formatter + linter (black removed). ruff format is
# black-compatible, so this is a drop-in.
[tool.ruff]
line-length = 100
target-version = "py314"
# Manual, on-demand tooling (Colab-style notebooks + throwaway scripts) is fenced
# off from the repo's gates — see tools/company_discovery/README.md. force-exclude
# makes ruff honor this even when pre-commit passes the paths explicitly.
extend-exclude = ["tools"]
force-exclude = true
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["google.cloud.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=shared --cov=ingest --cov=deliver --cov=evaluation --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
