# Example resume corpus. Copy to config/resume.yaml (gitignored) and fill in.
#
# Committed so a clone and CI build without the private file; loaded with a
# warning when config/resume.yaml is absent. Everything here is illustrative
# placeholder text.
#
# This is NOT a CV. Nobody reads it, so it has no page limit, no narrative arc,
# and no reason to drop the older role or the side project — every bullet you
# omit is a posting that cannot match. Write it by addition, not subtraction.
#
# Each bullet is scored on its own, so the useful unit is: what you built, with
# what, FOR WHOM, and what changed as a result. The "for whom" is what separates
# the role families — "built churn models" matches weakly everywhere; "built
# churn models the CS team used to prioritise outreach" is unmistakable.

summary: >
  Placeholder. A few sentences of plain prose describing what you do and the
  kind of team you do it on. This is what lets the scorer judge a posting whose
  vocabulary matches nothing in the lists below.

seniority: senior individual contributor

# Reported as eligibility (ok / restricted / unclear), never scored on and never
# used to drop a posting — rule 2 of the rubric in shared/resume.py.
constraints:
  - must be legally eligible to work in the posting's country
  - no relocation

# Free-form groups; names are yours. Rendered into the prompt as context, not as
# the matching key — the work history below is what gets matched.
skills:
  core_stack:
    - SQL
    - Python
    - dbt
  source_systems:
    - a CRM
    - a product analytics tool

work_history:
  - org: Example Corp
    industry: B2B SaaS
    title: What the work actually was
    # Kept because the two disagreeing is the norm, not the exception — and is
    # precisely why title matching fails (docs/research/relevance-signals.md).
    official_title: What the org chart called it
    period: 2020-01 to 2024-06
    location: Somewhere (Remote)
    bullets:
      - text: >
          Built X using Y so that Z could do W, replacing a manual process that
          took N hours. Name the audience and the outcome, not just the tool.
        # Optional. Must be from: analytics-engineer, forward-deployed-engineer,
        # gtm-engineer — an unknown value fails validation rather than being
        # silently ignored.
        evidences: [analytics-engineer]
      - text: >
          Another distinct piece of work. One bullet per thing built; splitting
          them is what lets a posting match the relevant half of your history.
        evidences: [analytics-engineer, gtm-engineer]

projects:
  - name: Example Project
    text: >
      What it does, what it is built with, and what is genuinely working versus
      planned. Personal projects count as evidence.
    evidences: [analytics-engineer]

education:
  - B.S. Something, YEAR — Institution, Country.
