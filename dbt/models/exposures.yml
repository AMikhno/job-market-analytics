version: 2

# The pipeline's downstream consumers, so lineage shows where gold actually goes
# (dbt docs renders these as terminal nodes of the DAG).
exposures:
  - name: email_digest
    label: Email digest of new postings
    type: application
    maturity: high
    url: https://github.com/AMikhno/job-market-analytics/blob/main/deliver/digest.py
    description: >
      deliver/digest.py — after each successful prod run, emails postings first seen
      since the last digest's watermark (ops.digest_runs), ordered by the soft
      signals (V2: by fit score). The score orders, never filters (ADR-0020).
      Delivery model: ADR-0019.
    depends_on:
      - ref('fct_job_postings')
    owner:
      name: Ana Mikhno

  - name: project_site
    label: Project site market charts
    type: dashboard
    maturity: medium
    url: https://amikhno.github.io/job-market-analytics/
    description: >
      The public site's market section. deliver/market_snapshot.py exports these
      aggregates after each prod run, re-checking the company floor, and the
      Docs workflow renders them as charts (ADR-0029). Built upstream of the
      location filter, so it describes the tracked boards, not the search.
    depends_on:
      - ref('agg_market_daily')
      - ref('agg_market_tenure')
      - ref('agg_market_roles')
      - ref('agg_market_tech')
      - ref('agg_market_ats')
    owner:
      name: Ana Mikhno
