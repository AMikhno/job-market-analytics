name: job_pipeline
version: "0.1.6"
config-version: 2
profile: job_pipeline

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

vars:
  # A board whose latest ingest lags the pipeline's latest by more than this is
  # considered retired (removed from the list, or persistently failing) and its
  # postings go inactive. ~2 missed runs of grace at the twice-daily cadence.
  board_staleness_hours: 36

  # match_score = desired_tech_hits + bonus*(title_match) - penalty*deal_breaker_hits.
  # One number, shown in the digest and used to order it (ADR-0024), so the score
  # a posting displays is the reason it sits where it does.
  # Technologies carry the weight because the target titles are too varied to
  # enumerate (Snowflake developer, BI migration, AI productivity analyst); the
  # title bonus is a nudge, not a gate. **Integers only** — the models declare
  # match_score as an integer type under the dbt contract.
  match_title_bonus: 2
  match_deal_breaker_penalty: 1

  # The model V2 extraction and scoring call. Pinned to an explicit version, not
  # left to the managed default and not the `gemini-flash-lite-latest` alias:
  # probed 2026-08-16, the unpinned default answered as gemini-2.5-flash, a
  # family retiring 2026-10-20 (ADR-0025). A floating alias has the same defect
  # more slowly -- it changes model under a column of scores that claims to be
  # comparable.
  #
  # Changing this re-processes both AI models rather than mixing outputs: their
  # incremental guards compare the recorded model, so the change enforces itself
  # instead of relying on someone remembering to bump something.
  # BigQuery keeps its own allowlist of endpoints, narrower than what Vertex
  # serves, so "newest on Vertex" is not the question -- "newest BigQuery
  # accepts" is. Probed 2026-08-16 from us-central1:
  #   gemini-3.1-flash-lite  works        <- newest flash-lite BigQuery accepts
  #   gemini-3.5-flash       works        (newer, but the flash tier, not lite)
  #   gemini-3.5-flash-lite  Unsupported endpoint
  #   gemini-3.1-flash       Unsupported endpoint
  # 3.5-flash-lite does answer on Vertex's global endpoint; the in-SQL functions
  # cannot reach it. Re-probe before assuming this list still holds.
  scoring_endpoint: gemini-3.1-flash-lite

  # The embedding matcher (int_jobs_matched). Unlike AI.GENERATE/AI.SCORE, which
  # are managed and take an endpoint name, ML.GENERATE_EMBEDDING needs a remote
  # MODEL object created once by DDL over a CLOUD_RESOURCE connection -- see the
  # preconditions in docs/v2-plan.md. Two vars because the SQL needs the
  # unquoted reference and the provenance column needs the quoted name.
  embedding_model: jobs_silver.text_embedding
  embedding_model_name: "'text-embedding-005'"

# Three medallion zones = dbt staging -> intermediate -> marts.
# Folder defaults below; per-model overrides live in-model:
#   - int_jobs__unioned        -> view  (free; ephemeral would block unit tests)
#   - int_jobs_structured/scored (V2) -> incremental (never recompute LLM calls)
models:
  job_pipeline:
    # Push model + column descriptions into the warehouse so BigQuery tables/views
    # are self-documenting (no-op on DuckDB dev, harmless).
    +persist_docs:
      relation: true
      columns: true
    # Each zone lands in its own dataset. dbt's default generate_schema_name
    # concatenates <target dataset>_<+schema>, giving jobs_bronze / jobs_silver /
    # jobs_gold on BigQuery (alongside the jobs_raw / jobs_ops the Python ingest
    # creates) and main_bronze / _silver / _gold on DuckDB dev. See ADR-0014.
    bronze:                       # staging
      +materialized: view
      +schema: bronze
    silver:                       # intermediate zone (several int_ models)
      +materialized: table
      +schema: silver
    gold:                         # marts
      +materialized: table
      +schema: gold

seeds:
  job_pipeline:
    +persist_docs:
      relation: true
      columns: true
