name: Docs

# Publish the Pages site on every push to main: the landing page, the rendered
# docs and the dbt lineage (`make site`, see scripts/build_site.py). DuckDB
# target, no secrets — same fork-safe posture as ci.yml. One-time setup: repo
# Settings → Pages → Source: GitHub Actions. Actions SHA-pinned (see ingest.yml
# for rationale).
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write   # deploy-pages OIDC; unrelated to the WIF use in ingest.yml

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0        # the decision log dates each ADR from the commit that added it
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --extra dev --locked

      - name: Build the site (landing + docs + dbt lineage, DuckDB target)
        run: |
          make ensure-raw          # empty raw tables so the project compiles
          make site                # dbt docs generate, then scripts/build_site.py -> _site/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
