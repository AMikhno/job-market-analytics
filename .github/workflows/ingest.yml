name: Ingest

# Twice daily, ~09:30 and ~15:00 America/Toronto. GitHub cron is UTC and ignores
# DST, so these drift one hour earlier in winter (harmless for a job digest).
#
# Failure alerting is GitHub-native: a failed run of a scheduled workflow emails
# the workflow's author/actor (no Slack, no webhook to rot — see ADR-0019).
# Warnings surface as run annotations + the step summary, and ride along in the
# email digest when one is sent.
#
# Actions are pinned to commit SHAs, not tags: this workflow holds `id-token:
# write` (WIF), and a hijacked moving tag could exfiltrate the OIDC exchange.
on:
  schedule:
    - cron: "30 13 * * *"   # 09:30 EDT / 08:30 EST
    - cron: "0 19 * * *"    # 15:00 EDT / 14:00 EST
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write           # required for Workload Identity Federation (no stored key)

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: production  # scopes the secrets below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --extra dev

      # The trust is pinned to this repository's immutable numeric id, not its
      # name, in two places that must agree: the provider's attribute condition
      # and the service account's principalSet binding. `repository_id`
      # survives renames and transfers.
      - name: Authenticate to Google Cloud (WIF — no service-account key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # The company list targets public job boards, so it's a GitHub Actions
      # *variable* (not a secret). Named COMPANIES_CSV_CONTENT to avoid colliding
      # with the COMPANIES_CSV env var that holds a file *path* (shared/config.py).
      - name: Materialize the private company list
        env:
          COMPANIES_CSV_CONTENT: ${{ vars.COMPANIES_CSV_CONTENT }}
        run: printf '%s' "$COMPANIES_CSV_CONTENT" > config/companies.csv

      - name: Ingest -> BigQuery raw
        env:
          PIPELINE_TARGET: prod
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET: jobs
          BQ_LOCATION: us-central1
          HTTP_USER_AGENT: ${{ vars.HTTP_USER_AGENT }}
        run: make ingest

      # Low volume, skipped boards, and sources that got no boards at all: three
      # ways the posting stream thins out while the run stays green. Warnings
      # must never be able to fail the run (the old Slack curl could), which is
      # why the reporter exits 0 on every path -- see ingest/report_run.py.
      #
      # Python, not jq: jq is a system binary from the runner image, absent from
      # uv.lock and from macOS, so the expressions it replaced could not be run
      # or tested anywhere but here.
      - name: Surface warnings (annotations + run summary)
        if: success()
        run: uv run python -m ingest.report_run

      - name: Fail fast on BigQuery dialect errors (compile, no mutations)
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          make dbt-deps
          cd dbt && uv run dbt compile --target prod

      # The resume corpus V2 scores against. A *secret*, not a variable like the
      # company list: variables are unencrypted and this repo is public, while
      # this file carries employer history, work authorization and education
      # (ADR-0027). Absent, the loader falls back to the committed example and
      # scores every posting against placeholder text -- so the step is skipped
      # rather than run with a stand-in, leaving fit_score null and delivery on
      # its V1 ordering, which is the honest degraded state.
      - name: Materialize the private resume and land the scoring prompt
        if: ${{ secrets.RESUME_YAML_CONTENT != '' }}
        env:
          PIPELINE_TARGET: prod
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET: jobs
          BQ_LOCATION: us-central1
          RESUME_YAML_CONTENT: ${{ secrets.RESUME_YAML_CONTENT }}
        run: |
          printf '%s' "$RESUME_YAML_CONTENT" > config/resume.yaml
          make scoring-prompt

      - name: Transform (bronze -> silver -> gold) on BigQuery
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: make dbt-prod

      - name: Freshness gate (fails the run if a source is stale or empty)
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: make freshness

      # New postings since the last digest's watermark (ops.digest_runs) are
      # emailed; a quiet-but-healthy run sends a "no new jobs" heartbeat instead.
      # Warnings from this run ride along as a footer either way. DIGEST_TO is a
      # secret (not a var) so the recipient stays masked in this public repo's logs.
      - name: Email digest or heartbeat
        env:
          PIPELINE_TARGET: prod
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET: jobs
          BQ_LOCATION: us-central1
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: make deliver

      # Dead-man's switch. GitHub suspends scheduled workflows after ~60 days of
      # repo inactivity, and a suspended workflow sends no failed-run email — so
      # "silently stopped" and "healthy" look identical from here. This pings
      # healthchecks.io only after a fully successful run; the alert fires when
      # the pings *stop*, which covers a suspended schedule, a failure earlier in
      # this job, and a runner that died mid-run alike.
      #
      # The ping URL embeds a check UUID, so it is a secret, not a var (anyone
      # holding it could ping the check and mask a dead pipeline).
      #
      # Never allowed to fail the run: an outage at the monitoring provider is
      # not a pipeline failure, and this step runs after the digest is already
      # sent. A failed ping degrades to a warning annotation — and, since the
      # check then goes unpinged, healthchecks.io alerts anyway.
      - name: Ping the dead-man's switch (healthchecks.io)
        if: success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "dead-man's switch disabled: HEALTHCHECK_URL not configured"
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" \
            || echo "::warning::dead-man's switch ping failed (the run itself succeeded)"
