version: 2
models:
  - name: int_jobs__unioned
    description: All sources unioned into one shape, with identity key, change hash, and cleaned text.
    columns:
      - name: job_key
        description: Surrogate of (source, company, external_id) — stable posting identity.
        data_tests: [not_null]
      - name: content_hash
        description: Surrogate of (title, clean_text); changes when the posting text changes (V2 reprocessing key).
        # Tested on int_jobs__latest, not here: on this view the test hashes every
        # description in the retained history, a full extra scan on each run.
  - name: int_jobs__latest
    description: >
      One row per posting across every tracked board: its latest landing and its
      lifecycle, before any filter. The single full read of description history
      in a run; silver_jobs, the market tech mentions and the posting history all
      read from here (ADR-0030).
    columns:
      - name: job_key
        description: Stable posting identity; the grain of this table.
        data_tests: [not_null, unique]
      - name: content_hash
        description: Change-detection hash of (title, clean_text).
        data_tests: [not_null]
      - name: first_seen_at
        description: Earliest retained ingest that contained this posting.
        data_tests: [not_null]
      - name: last_seen_at
        description: Most recent ingest that still contained this posting.
        data_tests: [not_null]
      - name: is_active
        description: >
          On its board's latest ingest, and the board was ingested within
          board_staleness_hours of the pipeline's latest ingest.
        data_tests: [not_null]
  - name: int_posting_state
    description: >
      The columns snap_job_postings tracks. Keeps description text out of a table
      that stores every column once per version.
    columns:
      - name: job_key
        data_tests: [not_null, unique]
  - name: int_posting_changes
    description: >
      One row per change to a posting, from its snapshot history: which fields
      moved, how long the previous version lasted, and whether a text change was
      part of a board-wide edit.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [job_key, changed_at]
    columns:
      - name: job_key
        data_tests: [not_null]
      - name: changed_at
        description: The snapshot run that recorded the change.
        data_tests: [not_null]
      - name: days_in_previous_version
        description: Whole calendar days between the previous version and this change.
        data_tests: [not_null]
      - name: content_changed
        description: The title or text changed. Body-only edits are this and not title_changed.
        data_tests: [not_null]
      - name: title_changed
        data_tests: [not_null]
      - name: location_changed
        data_tests: [not_null]
      - name: remote_policy_changed
        data_tests: [not_null]
      - name: closed
        description: The posting went from live to not live in this change.
        data_tests: [not_null]
      - name: reopened
        description: The posting went from not live to live in this change.
        data_tests: [not_null]
      - name: is_board_wide_edit
        description: >
          A text change made in a run that changed at least board_wide_edit_share
          of the board's live postings, on a board of at least
          board_wide_edit_min_postings. Most likely a shared template edit.
        data_tests: [not_null]
  - name: silver_jobs
    description: >
      Deduplicated, location-filtered postings ready for V1 delivery / V2 AI, with
      lifecycle columns (first_seen_at / last_seen_at / is_active) so net-new and
      taken-down postings are distinguishable, plus match signals that annotate but
      never drop: desired_tech_hits / title_match (ADR-0015) and the negative
      deal_breaker_hits / deal_breaker_terms (ADR-0023). Location is the only
      hard filter.
    # Contract enforced on the DuckDB dev target — CI builds it on every PR, so
    # column drift and type regressions (e.g. the old cast-null-as-varchar) fail
    # fast. Declared types are DuckDB's; the BigQuery build reports STRING/BOOL/
    # INT64, so enforcement is dev-scoped rather than breaking prod on type names.
    config:
      contract:
        enforced: "{{ target.type == 'duckdb' }}"
    columns:
      - name: job_key
        description: Stable posting identity; silver keeps the latest row per key.
        data_type: varchar
        data_tests: [not_null, unique]
      - name: content_hash
        description: Change-detection hash of (title, clean_text); V2 reprocessing key.
        data_type: varchar
      - name: source
        description: ATS the posting came from ("greenhouse" | "lever" | "ashby").
        data_type: varchar
      - name: company
        description: The board_ref the posting was fetched from.
        data_type: varchar
      - name: external_id
        description: Source-native posting id, as text.
        data_type: varchar
      - name: title
        data_type: varchar
      - name: location
        data_type: varchar
      - name: remote_policy
        data_type: varchar
      - name: department
        data_type: varchar
      - name: employment_type
        data_type: varchar
      - name: url
        description: Link to the live posting.
        data_type: varchar
        data_tests: [not_null]
      - name: description_html
        data_type: varchar
      - name: clean_text
        description: Tag-stripped posting text used by the keyword filter.
        data_type: varchar
      - name: posted_or_updated_at
        data_type: timestamp
      - name: ingested_at
        data_type: timestamp
      - name: first_seen_at
        description: >
          Earliest ingest timestamp that contained this posting; a job_key whose
          first_seen_at is in the current run is net-new ("new since last run").
        data_type: timestamp
        data_tests: [not_null]
      - name: last_seen_at
        description: Most recent ingest timestamp that still contained this posting.
        data_type: timestamp
        data_tests: [not_null]
      - name: desired_tech_hits
        description: >
          Count of desired-tech seed terms word-matched in clean_text. Soft
          signal — annotates, never drops (ADR-0015).
        data_type: bigint
        data_tests: [not_null]
      - name: title_match
        description: >
          True if the title word-matches a desired_titles pattern. Soft signal —
          annotates, never drops (ADR-0015).
        data_type: boolean
        data_tests: [not_null]
      - name: deal_breaker_hits
        description: >
          How many distinct deal_breaker_tech terms appear in clean_text. 0 = clean.
          A *negative* signal, not a filter (ADR-0023): one mention anywhere in the
          text — including a nice-to-have line — used to delete the posting, which
          removed roles matching on everything else.
        data_type: bigint
        data_tests: [not_null]
      - name: deal_breaker_terms
        description: >
          Which deal-breaker terms matched, comma-separated and sorted; null when
          none did. Named rather than merely counted so a posting can be judged
          ("Kafka" as a nice-to-have vs a streaming role) without opening it.
        data_type: varchar
      - name: match_score
        description: >
          desired_tech_hits + match_title_bonus*(title_match) −
          match_deal_breaker_penalty*deal_breaker_hits. The single key delivery
          orders on (ADR-0024); may be negative. Weights are dbt vars.
        data_type: bigint
        data_tests: [not_null]
      - name: is_active
        description: >
          True while the posting is present in its board's latest ingest AND that
          board itself was ingested within board_staleness_hours of the pipeline's
          latest ingest — so postings from boards removed from the company list
          (or persistently failing) age out of gold instead of lingering forever.
        data_type: boolean
        data_tests: [not_null]

  - name: int_jobs_structured
    description: >
      Typed extraction from posting text (V2, prod-only — a typed-null stub on
      DuckDB). One row per content_hash: incremental, because re-extracting the
      ~24 re-landings each posting accumulates would re-bill every run. A failed
      generation lands extract_ok = false and is retried next run rather than
      being silently dropped or scored.
    columns:
      - name: content_hash
        description: >
          Extraction key, the incremental cost guard, and the grain: exactly one
          row per distinct posting text.
        # Tested, not just described: the first build selected one row per
        # *posting*, 17 of which shared a hash with another — double-billing the
        # same text and fanning gold's join out into duplicate job_keys. Only
        # gold's unique test caught it, one layer too late.
        data_tests: [not_null, unique]
      - name: relevant_text
        description: >
          Requirements, nice-to-haves, responsibilities, and what the company
          does — with culture, history, hiring process, benefits and EEO
          boilerplate dropped. Scoring this rather than the whole posting is the
          central finding in docs/research/relevance-signals.md; keeping
          responsibilities and nice-to-haves corrects it, because a resume is
          written as accomplishments and nice-to-haves are rarely optional here.
      - name: company_type
        description: >
          Short employer label (B2B SaaS, bank, government, staffing agency…).
          Earns its place because three data-platform *vendors* contributed
          1,639 postings and zero relevant ones, while companies that run on
          data converted well.
      - name: geo_restriction
        description: >
          Where the work may be done from — never visa sponsorship. The one
          extracted field the rule-based gate provably cannot replace: silver
          keeps any posting whose location is bare "Remote", so a US-only role
          reaches gold with the restriction stated only in the description.
        data_tests:
          - accepted_values:
              arguments:
                values: [us_only, canada_ok, unclear]
              config:
                severity: warn
      - name: manages_people
        description: >
          Whether the described scope includes direct reports or hiring, judged
          from the work and never the title. Three-state because "unclear" is
          common and a boolean would force a guess. Years of experience does not
          substitute: years is a depth bar, this is the shape of the seat.
        data_tests:
          # QUOTED, and that is not style: YAML 1.1 parses bare yes/no as
          # booleans, so `[yes, no, unclear]` became True/False/unclear and the
          # test flagged every correctly-extracted row. It warned rather than
          # failed, which is how a wrong gate survives — as skippable noise.
          - accepted_values:
              arguments:
                values: ["yes", "no", "unclear"]
              config:
                severity: warn
      - name: nice_to_have_techs
        description: Comma-joined; kept because in this market they are rarely optional.
      - name: extract_ok
        description: False when the generation failed; such rows are retried, never scored.
      - name: extract_model
        description: Model that produced the extraction, read back from the API response.

  - name: int_jobs_scored
    description: >
      1-5 fit score of requirement_text against the resume corpus (ADR-0027),
      prod-only with a typed-null stub on DuckDB. Scores only rows that
      extracted successfully; the score orders delivery and never filters it
      (ADR-0020).
    columns:
      - name: content_hash
        description: >
          Scoring key and grain — one row per distinct posting text. Part of the
          incremental guard, with prompt_version and scoring_model.
        data_tests: [not_null, unique]
      - name: fit_score
        description: >
          1-5, higher is better. Tested here as well as in gold, because gold's
          nulling of out-of-range values would otherwise hide a systematically
          broken model.
        data_tests:
          # WARN here, ERROR on fct_job_postings, and the difference is the
          # point: the first backfill produced a handful of out-of-range
          # generations (ADR-0025), and gold nulls them, so failing the
          # twice-daily prod run over one would be an outage caused by a
          # rounding artifact. One reaching *gold* means the nulling broke.
          #
          # Nested under `arguments` as of dbt 1.10; top-level args still work
          # but are deprecated.
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
              config:
                severity: warn
      - name: prompt_version
        description: >
          Which rendered prompt produced the score. A bump re-scores, because a
          score is only comparable to another from the same wording.
      - name: scoring_model
        description: Pinned endpoint, not the managed default (ADR-0025).

  - name: int_jobs_assessed
    description: >
      Requirement-by-requirement assessment of a posting against the candidate
      profile (ADR-0031): which must-haves it states, and which of them the
      profile does not show. Facts only — the tier is computed from these in
      int_jobs_tiered. Off until `enable_assessment` is set, and a typed-null
      stub on DuckDB either way.
    columns:
      - name: content_hash
        description: >
          Assessment key and grain — one row per distinct posting text. Part of
          the incremental guard, with profile_version, assessment_version and
          assess_endpoint.
        data_tests: [not_null, unique]
      - name: field_relation
        description: >
          How the described work relates to the candidate's field, judged from
          the work and never the title. `interest` is work the candidate would
          apply to despite a gap; `unrelated` is the only value delivery
          collapses.
        data_tests:
          - accepted_values:
              arguments:
                values: [core, adjacent, interest, unrelated]
              config:
                severity: warn
      - name: level_distance
        description: >
          Seniority the posting's scope implies minus the candidate's level, in
          whole rungs; negative when the posting is more junior, null when it
          does not say. A distance rather than a level, so the candidate's own
          level stays in the private profile. Staff, lead and first-line
          manager are one rung: a people-management track beside a senior
          individual one is a different seat, not a more distant one.
      - name: must_have_count
        description: How many requirements the posting states as required.
      - name: soft_gap_count
        description: Missing must-haves an employer would plausibly waive.
      - name: hard_gap_count
        description: >
          Missing must-haves an employer would not waive — a cannot-claim item,
          a required domain, a core function never performed, years short by two
          or more, a required language or credential.
      - name: soft_gaps
        description: The soft gaps, semicolon-joined.
      - name: hard_gaps
        description: The hard gaps, semicolon-joined.
      - name: why
        description: One sentence naming the strongest match.
      - name: gap
        description: One sentence naming the most serious missing must-have; empty when none.
      - name: assess_ok
        description: False when the generation failed; such rows are retried and never tiered.
      - name: profile_version
        description: Which rendered profile the posting was assessed against.
      - name: assessment_version
        description: Which wording of the instruction produced the row.
      - name: assess_endpoint
        description: Pinned endpoint, not the managed default (ADR-0025).

  - name: int_jobs_tiered
    description: >
      The tier each assessed posting falls in, computed in SQL from the
      assessment's facts (ADR-0031). A view, so a threshold change re-tiers
      every posting without a model call.
    columns:
      - name: content_hash
        description: One row per assessed posting text.
        data_tests: [not_null, unique]
      - name: fit_tier
        description: >
          fit / near / reach / unrelated. The rule is ordered: unrelated first,
          then any hard gap, then soft gaps and level.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [fit, near, reach, unrelated]
      - name: tier_rank
        description: The tier as a number, 3 (fit) to 0 (unrelated).
        data_tests: [not_null]

unit_tests:
  - name: dedup_keeps_the_most_recently_ingested_row
    description: >
      Lever re-ingests tie on posted_or_updated_at (createdAt never changes);
      ingested_at must break the tie so an edited posting surfaces.
    model: int_jobs__latest
    given:
      - input: ref('int_jobs__unioned')
        rows:
          - {job_key: k1, source: lever, company: acme, title: old title, clean_text: "",
             location: "Ottawa, Canada", ingested_at: 2026-07-01 10:00:00, posted_or_updated_at: 2026-06-01 00:00:00}
          - {job_key: k1, source: lever, company: acme, title: new title, clean_text: "",
             location: "Ottawa, Canada", ingested_at: 2026-07-02 10:00:00, posted_or_updated_at: 2026-06-01 00:00:00}
    expect:
      rows:
        - {job_key: k1, title: new title}

  - name: rows_within_one_landing_resolve_to_the_same_location_every_run
    description: >
      One landing can hold several rows for one posting, one per city, tied on
      both timestamps. Location breaks the tie, or the chosen city could differ
      between runs and the snapshot would record a change nobody made.
    model: int_jobs__latest
    given:
      - input: ref('int_jobs__unioned')
        rows:
          - {job_key: k1, source: workable, company: acme, title: a, location: Toronto,
             ingested_at: 2026-07-02 10:00:00, posted_or_updated_at: 2026-06-01 00:00:00}
          - {job_key: k1, source: workable, company: acme, title: a, location: Montreal,
             ingested_at: 2026-07-02 10:00:00, posted_or_updated_at: 2026-06-01 00:00:00}
          - {job_key: k1, source: workable, company: acme, title: a, location: null,
             ingested_at: 2026-07-02 10:00:00, posted_or_updated_at: 2026-06-01 00:00:00}
    expect:
      rows:
        - {job_key: k1, location: Montreal}

  - name: latest_applies_no_location_filter
    description: >
      The market models and the posting history read this table, and neither may
      depend on the private location rules (ADR-0028, ADR-0029), so a posting
      anywhere in the world stays in it.
    model: int_jobs__latest
    given:
      - input: ref('int_jobs__unioned')
        rows:
          - {job_key: k1, source: lever, company: acme, title: a, location: "Berlin, Germany",
             ingested_at: 2026-07-02 10:00:00}
    expect:
      rows:
        - {job_key: k1, location: "Berlin, Germany", is_active: true}

  - name: silver_passes_the_lifecycle_through
    description: >
      Lifecycle is derived upstream now, and gold and the digest still read it
      from silver, so all three columns must survive the filter unchanged.
    model: silver_jobs
    given:
      - input: ref('int_jobs__latest')
        rows:
          - {job_key: k1, title: a, clean_text: "", location: "Ottawa, Canada",
             first_seen_at: 2026-07-01 10:00:00, last_seen_at: 2026-07-02 10:00:00, is_active: false}
      - input: ref('deal_breaker_tech')
        rows: []
      - input: ref('allowed_locations')
        rows: [{pattern: Canada}]
      - input: ref('desired_tech')
        rows: []
      - input: ref('desired_titles')
        rows: []
    expect:
      rows:
        - {job_key: k1, first_seen_at: 2026-07-01 10:00:00, last_seen_at: 2026-07-02 10:00:00, is_active: false}

  - name: deal_breaker_annotates_and_matches_words_not_substrings
    description: >
      A deal-breaker is a negative signal, not a filter (ADR-0023): every posting
      survives and carries which terms matched. "Kafka a plus" counts;
      "Kafkaesque" does not (word edges); matching is case-insensitive; a posting
      naming two terms counts both, sorted.
    model: silver_jobs
    given:
      - input: ref('int_jobs__latest')
        rows:
          - {job_key: k1, source: lever, company: acme, title: a, clean_text: We use Kafka daily,
             location: "Ottawa, Canada", ingested_at: 2026-07-02 10:00:00}
          - {job_key: k2, source: lever, company: acme, title: b, clean_text: Kafkaesque bureaucracy,
             location: "Ottawa, Canada", ingested_at: 2026-07-02 10:00:00}
          - {job_key: k3, source: lever, company: acme, title: c, clean_text: knows kafka a plus,
             location: "Ottawa, Canada", ingested_at: 2026-07-02 10:00:00}
          - {job_key: k4, source: lever, company: acme, title: d, clean_text: Spark and Kafka pipelines,
             location: "Ottawa, Canada", ingested_at: 2026-07-02 10:00:00}
      - input: ref('deal_breaker_tech')
        rows: [{tech: Kafka}, {tech: Spark}]
      - input: ref('allowed_locations')
        rows: [{pattern: Canada}]
      - input: ref('desired_tech')
        rows: []
      - input: ref('desired_titles')
        rows: []
    expect:
      rows:
        - {job_key: k1, deal_breaker_hits: 1, deal_breaker_terms: Kafka}
        - {job_key: k2, deal_breaker_hits: 0, deal_breaker_terms: }
        - {job_key: k3, deal_breaker_hits: 1, deal_breaker_terms: Kafka}
        - {job_key: k4, deal_breaker_hits: 2, deal_breaker_terms: "Kafka, Spark"}

  - name: match_score_combines_the_signals_into_one_ordering_key
    description: >
      match_score = desired_tech_hits + bonus*(title_match) − penalty*hits
      (ADR-0024), with the default bonus 2 / penalty 1. A strong posting carrying
      one incidental deal-breaker must still outrank a weak clean one — that is
      the whole point of scoring rather than sorting on the flag first.
    model: silver_jobs
    given:
      - input: ref('int_jobs__latest')
        rows:
          # 2 tech + title bonus 2 - 1 deal-breaker = 3
          - {job_key: strong_flagged, source: lever, company: acme, title: Analytics Engineer,
             clean_text: "dbt and SQL, some Kafka", location: "Ottawa, Canada",
             ingested_at: 2026-07-02 10:00:00}
          # 0 tech, no title, clean = 0
          - {job_key: weak_clean, source: lever, company: acme, title: Chef,
             clean_text: "cooking", location: "Ottawa, Canada", ingested_at: 2026-07-02 10:00:00}
          # 2 tech, no title, clean = 2
          - {job_key: mid_clean, source: lever, company: acme, title: Cook,
             clean_text: "dbt and SQL", location: "Ottawa, Canada", ingested_at: 2026-07-02 10:00:00}
      - input: ref('deal_breaker_tech')
        rows: [{tech: Kafka}]
      - input: ref('allowed_locations')
        rows: [{pattern: Canada}]
      - input: ref('desired_tech')
        rows: [{tech: dbt}, {tech: SQL}]
      - input: ref('desired_titles')
        rows: [{pattern: Analytics}]
    expect:
      rows:
        - {job_key: strong_flagged, match_score: 3}
        - {job_key: weak_clean, match_score: 0}
        - {job_key: mid_clean, match_score: 2}

  - name: location_gate_keeps_null_bare_remote_and_in_scope
    description: >
      Keep a posting whose location is unknown (null OR blank), is bare "Remote",
      or word-matches a marker from the seed. Drop everything else. The rows below
      supply their own seed fixture, so they exercise the matching rule rather
      than whatever the real list happens to hold: word-matched, so a two-letter
      abbreviation matches "City, XX" and not a longer word containing it. Blank
      is pinned alongside null because an ATS that publishes an empty location and
      one that omits the field mean the same thing.
    model: silver_jobs
    given:
      - input: ref('int_jobs__latest')
        rows:
          - {job_key: remote, source: lever, company: acme, title: a, clean_text: "",
             location: Remote, ingested_at: 2026-07-02 10:00:00}
          - {job_key: unknown, source: lever, company: acme, title: b, clean_text: "",
             location: null, ingested_at: 2026-07-02 10:00:00}
          - {job_key: empty, source: lever, company: acme, title: b2, clean_text: "",
             location: "", ingested_at: 2026-07-02 10:00:00}
          - {job_key: blank, source: lever, company: acme, title: b3, clean_text: "",
             location: "   ", ingested_at: 2026-07-02 10:00:00}
          - {job_key: padded_remote, source: lever, company: acme, title: b4, clean_text: "",
             location: "  Remote  ", ingested_at: 2026-07-02 10:00:00}
          - {job_key: canada, source: lever, company: acme, title: c, clean_text: "",
             location: "Ottawa, ON, Canada", ingested_at: 2026-07-02 10:00:00}
          - {job_key: on_abbrev, source: lever, company: acme, title: d, clean_text: "",
             location: "Ottawa, ON", ingested_at: 2026-07-02 10:00:00}
          - {job_key: toronto, source: lever, company: acme, title: e, clean_text: "",
             location: Toronto, ingested_at: 2026-07-02 10:00:00}
          - {job_key: montreal, source: lever, company: acme, title: f, clean_text: "",
             location: "Montreal, QC", ingested_at: 2026-07-02 10:00:00}
          - {job_key: london, source: lever, company: acme, title: g, clean_text: "",
             location: "London, UK", ingested_at: 2026-07-02 10:00:00}
          - {job_key: foreign, source: lever, company: acme, title: h, clean_text: "",
             location: "Berlin, Germany", ingested_at: 2026-07-02 10:00:00}
          - {job_key: uk_remote, source: lever, company: acme, title: i, clean_text: "",
             location: Remote - United Kingdom, ingested_at: 2026-07-02 10:00:00}
      - input: ref('deal_breaker_tech')
        rows: []
      - input: ref('allowed_locations')
        rows: [{pattern: Canada}, {pattern: Ontario}, {pattern: ON}, {pattern: Ottawa}, {pattern: Toronto}, {pattern: Montreal}]
      - input: ref('desired_tech')
        rows: []
      - input: ref('desired_titles')
        rows: []
    expect:
      rows:
        - {job_key: remote}
        - {job_key: unknown}
        - {job_key: empty}
        - {job_key: blank}
        - {job_key: padded_remote}
        - {job_key: canada}
        - {job_key: on_abbrev}
        - {job_key: toronto}
        - {job_key: montreal}

  - name: posting_missing_from_latest_board_ingest_is_inactive
    description: >
      k2 was seen on 07-01 but not in the board's 07-02 ingest — it was taken
      down. It stays in silver (history) but is_active must be false. Also pins
      first_seen_at to the earliest ingest (k1 first seen 07-01, not 07-02).
    model: int_jobs__latest
    given:
      - input: ref('int_jobs__unioned')
        rows:
          - {job_key: k1, source: lever, company: acme, title: live, clean_text: "",
             location: "Ottawa, Canada", ingested_at: 2026-07-01 10:00:00}
          - {job_key: k1, source: lever, company: acme, title: live, clean_text: "",
             location: "Ottawa, Canada", ingested_at: 2026-07-02 10:00:00}
          - {job_key: k2, source: lever, company: acme, title: gone, clean_text: "",
             location: "Ottawa, Canada", ingested_at: 2026-07-01 10:00:00}
    expect:
      rows:
        - {job_key: k1, is_active: true, first_seen_at: 2026-07-01 10:00:00}
        - {job_key: k2, is_active: false, first_seen_at: 2026-07-01 10:00:00}

  - name: postings_from_stale_boards_go_inactive
    description: >
      deadco's board was last ingested on 06-25 — far beyond board_staleness_hours
      (36) of the pipeline's latest ingest (07-02) — so its posting goes inactive
      even though it was present in its own board's last ingest (the zombie-board
      case: removed from the company list or 404-ing forever). acme, ingested one
      hour before the pipeline's latest, is comfortably within grace and stays
      active.
    model: int_jobs__latest
    given:
      - input: ref('int_jobs__unioned')
        rows:
          - {job_key: live, source: lever, company: acme, title: a, clean_text: "",
             location: "Ottawa, Canada", ingested_at: 2026-07-02 09:00:00}
          - {job_key: zombie, source: lever, company: deadco, title: b, clean_text: "",
             location: "Ottawa, Canada", ingested_at: 2026-06-25 10:00:00}
          - {job_key: yardstick, source: greenhouse, company: other, title: c, clean_text: "",
             location: "Ottawa, Canada", ingested_at: 2026-07-02 10:00:00}
    expect:
      rows:
        - {job_key: live, is_active: true}
        - {job_key: zombie, is_active: false}
        - {job_key: yardstick, is_active: true}

  - name: seed_terms_with_regex_specials_match_literally
    description: >
      Seed terms are matched as literals, not regex fragments: "C++" matches
      (no word boundary exists after '+', and unescaped '+' is a regex
      quantifier), "C#" matches, and ".NET" does not hit "knet" (unescaped
      '.' would match any character). Applies to every seed-driven matcher.
    model: silver_jobs
    given:
      - input: ref('int_jobs__latest')
        rows:
          - {job_key: cpp, source: lever, company: acme, title: a,
             clean_text: "Modern C++ services", location: "Ottawa, Canada",
             ingested_at: 2026-07-02 10:00:00}
          - {job_key: dotnet, source: lever, company: acme, title: b,
             clean_text: "backend in .NET and C#", location: "Ottawa, Canada",
             ingested_at: 2026-07-02 10:00:00}
          - {job_key: knet, source: lever, company: acme, title: c,
             clean_text: "uses the knet framework", location: "Ottawa, Canada",
             ingested_at: 2026-07-02 10:00:00}
      - input: ref('deal_breaker_tech')
        rows: []
      - input: ref('allowed_locations')
        rows: [{pattern: Canada}]
      - input: ref('desired_tech')
        rows: [{tech: "C++"}, {tech: "C#"}, {tech: ".NET"}]
      - input: ref('desired_titles')
        rows: []
    expect:
      rows:
        - {job_key: cpp, desired_tech_hits: 1}
        - {job_key: dotnet, desired_tech_hits: 2}
        - {job_key: knet, desired_tech_hits: 0}

  - name: soft_signals_annotate_without_dropping
    description: >
      desired_tech_hits counts desired techs word-matched in clean_text and
      title_match flags a targeted title — but neither drops a row: a posting
      with no desired tech and a non-target title still survives (soft, ADR-0015).
    model: silver_jobs
    given:
      - input: ref('int_jobs__latest')
        rows:
          - {job_key: hit, source: lever, company: acme, title: Analytics Engineer,
             clean_text: "We use dbt and BigQuery daily", location: "Ottawa, Canada",
             ingested_at: 2026-07-02 10:00:00}
          - {job_key: miss, source: lever, company: acme, title: Office Manager,
             clean_text: "general office administration", location: "Ottawa, Canada",
             ingested_at: 2026-07-02 10:00:00}
      - input: ref('deal_breaker_tech')
        rows: []
      - input: ref('allowed_locations')
        rows: [{pattern: Canada}]
      - input: ref('desired_tech')
        rows: [{tech: dbt}, {tech: BigQuery}]
      - input: ref('desired_titles')
        rows: [{pattern: Analytics}]
    expect:
      rows:
        - {job_key: hit, desired_tech_hits: 2, title_match: true}
        - {job_key: miss, desired_tech_hits: 0, title_match: false}

