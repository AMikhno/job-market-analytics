# Fast formatters/linters on commit; the full test suite on push.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format            # single formatter (black removed)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks: [{ id: gitleaks }]            # hard backstop against committed secrets
  - repo: local
    hooks:
      # Run mypy in the project venv (sees pydantic-settings, duckdb, etc.) and
      # only on shipped code — tests aren't held to --strict. Matches `make lint`.
      - id: mypy
        name: mypy (shared + ingest + deliver)
        entry: uv run mypy shared ingest deliver
        language: system
        pass_filenames: false
        types: [python]
      # gitleaks catches credentials; this catches the other private thing here —
      # company identifiers and personal context. It reads gitignored term
      # sources, so it can only run locally and is deliberately not a CI gate.
      - id: private-terms
        name: Private identifiers (company names, board refs, personal context)
        entry: uv run python scripts/check_private_terms.py
        language: system
        types: [text]
      - id: private-terms-msg
        name: Private identifiers in the commit message
        entry: uv run python scripts/check_private_terms.py
        language: system
        stages: [commit-msg]
      # A workflow that fails validation is not a failed run — it is no run at
      # all, on a schedule, with no email. Cheap to catch here; `make lint`
      # re-runs it in CI so --no-verify cannot land one.
      - id: actionlint
        name: actionlint (GitHub Actions workflows)
        entry: uv run actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      # Every push must have passing, covered tests.
      - id: pytest
        name: pytest (with coverage gate)
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
