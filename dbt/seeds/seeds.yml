version: 2
seeds:
  - name: deal_breaker_tech
    description: Technologies whose presence disqualifies a posting (V1 keyword rule).
    columns:
      - name: tech
        description: Word-matched, case-insensitive; keep entries regex-metacharacter-free.
        data_tests: [not_null, unique]
  - name: allowed_locations
    description: >
      Positive location markers for the V1 filter (word-matched,
      case-insensitive). A posting is kept if its location is unknown (null or
      blank), is bare "Remote", or word-matches one of these markers. The search
      is national, so the list holds the country, its provinces and their
      abbreviations, and the cities worth commuting to — in both official
      languages, since a bilingual board publishes either.

      Word-matched rather than substring, so a two-letter province abbreviation
      matches "City, XX" without matching a longer word that happens to contain
      it; keep entries regex-metacharacter-free. Accented spellings do not fold:
      the boundary class is ASCII and lower() leaves the accent, so a French
      place name needs both spellings seeded — or just the province
      abbreviation, which covers a whole province in one row. No country
      blocklist; V2's LLM does true location eligibility.
    columns:
      - name: pattern
        data_tests: [not_null, unique]
  - name: desired_tech
    description: >
      Technologies a good match tends to name. SOFT signal (ADR-0015): silver
      counts how many appear in the posting text (desired_tech_hits) but never
      drops a row. Word-matched, case-insensitive; keep entries
      regex-metacharacter-free.
    columns:
      - name: tech
        data_tests: [not_null, unique]
      - name: note
        description: Why it is on the list (documentation only; unused in SQL).
  - name: desired_titles
    description: >
      Title patterns for targeted roles. SOFT signal (ADR-0015): silver flags
      whether the posting title word-matches one (title_match) but never drops a
      row. Word-matched, case-insensitive; keep entries regex-metacharacter-free.
    columns:
      - name: pattern
        data_tests: [not_null, unique]
      - name: note
        description: What it targets (documentation only; unused in SQL).

  # The two market vocabularies are public, unlike the four seeds above (ADR-0029):
  # they describe the market the charts summarize, not anyone's preferences.
  - name: market_title_families
    description: >
      Title patterns that group postings into data role families for the site's
      market charts. Word-matched, case-insensitive. A title matching several
      patterns takes the family with the lowest priority, so "Analytics Engineer"
      lands in analytics engineering, not the generic "analytics" catch-all.
    columns:
      - name: pattern
        data_tests: [not_null, unique]
      - name: family
        data_tests: [not_null]
      - name: priority
        description: Lower wins when a title matches more than one family.
        data_tests: [not_null]
  - name: market_tech_vocabulary
    description: >
      Generic data-stack terms the market charts count mentions of. Several
      patterns may share a label (PostgreSQL and Postgres), and a posting counts
      once per label. Word-matched, case-insensitive, matched as literals.
    columns:
      - name: pattern
        data_tests: [not_null, unique]
      - name: label
        data_tests: [not_null]
      - name: category
        data_tests: [not_null]
