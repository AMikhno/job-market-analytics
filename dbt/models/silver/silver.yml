  # The tier rule, one row per branch. It lives in SQL so that it can be pinned
  # like this: a model asked for a 1-5 has no rule to test.
  - name: tier_rule_orders_unrelated_then_hard_gaps_then_soft
    model: int_jobs_tiered
    given:
      - input: ref('int_jobs_assessed')
        rows:
          - {content_hash: clean, assess_ok: true, field_relation: core, level_distance: 0, soft_gap_count: 0, hard_gap_count: 0}
          - {content_hash: one_soft, assess_ok: true, field_relation: core, level_distance: 0, soft_gap_count: 1, hard_gap_count: 0}
          - {content_hash: two_soft, assess_ok: true, field_relation: core, level_distance: 0, soft_gap_count: 2, hard_gap_count: 0}
          - {content_hash: below_level, assess_ok: true, field_relation: core, level_distance: -1, soft_gap_count: 0, hard_gap_count: 0}
          - {content_hash: one_hard, assess_ok: true, field_relation: core, level_distance: 0, soft_gap_count: 0, hard_gap_count: 1}
          - {content_hash: hard_beats_soft, assess_ok: true, field_relation: core, level_distance: 0, soft_gap_count: 3, hard_gap_count: 1}
          - {content_hash: interest_clean, assess_ok: true, field_relation: interest, level_distance: 0, soft_gap_count: 0, hard_gap_count: 0}
          - {content_hash: adjacent_clean, assess_ok: true, field_relation: adjacent, level_distance: 0, soft_gap_count: 0, hard_gap_count: 0}
          - {content_hash: other_field, assess_ok: true, field_relation: unrelated, level_distance: 0, soft_gap_count: 0, hard_gap_count: 0}
          - {content_hash: unrelated_beats_clean, assess_ok: true, field_relation: unrelated, level_distance: 0, soft_gap_count: 0, hard_gap_count: 0}
          - {content_hash: two_rungs_up, assess_ok: true, field_relation: core, level_distance: 2, soft_gap_count: 0, hard_gap_count: 0}
          - {content_hash: two_rungs_down, assess_ok: true, field_relation: core, level_distance: -2, soft_gap_count: 0, hard_gap_count: 0}
          - {content_hash: one_rung_up, assess_ok: true, field_relation: core, level_distance: 1, soft_gap_count: 0, hard_gap_count: 0}
          - {content_hash: level_unstated, assess_ok: true, field_relation: core, level_distance: null, soft_gap_count: 0, hard_gap_count: 0}
          - {content_hash: failed, assess_ok: false, field_relation: core, level_distance: 0, soft_gap_count: 0, hard_gap_count: 0}
    expect:
      rows:
        - {content_hash: clean, fit_tier: fit, tier_rank: 3}
        - {content_hash: one_soft, fit_tier: fit, tier_rank: 3}
        - {content_hash: two_soft, fit_tier: near, tier_rank: 2}
        - {content_hash: below_level, fit_tier: near, tier_rank: 2}
        - {content_hash: one_hard, fit_tier: reach, tier_rank: 1}
        - {content_hash: hard_beats_soft, fit_tier: reach, tier_rank: 1}
        # Work listed only as an interest is never ranked above a long shot.
        - {content_hash: interest_clean, fit_tier: reach, tier_rank: 1}
        - {content_hash: adjacent_clean, fit_tier: fit, tier_rank: 3}
        - {content_hash: other_field, fit_tier: unrelated, tier_rank: 0}
        - {content_hash: unrelated_beats_clean, fit_tier: unrelated, tier_rank: 0}
        - {content_hash: two_rungs_up, fit_tier: unrelated, tier_rank: 0}
        - {content_hash: two_rungs_down, fit_tier: unrelated, tier_rank: 0}
        - {content_hash: one_rung_up, fit_tier: fit, tier_rank: 3}
        # An unstated level moves nothing.
        - {content_hash: level_unstated, fit_tier: fit, tier_rank: 3}
        # `failed` is absent: a failed generation has no facts to tier.
