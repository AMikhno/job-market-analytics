version: 2
models:
  - name: fct_job_postings
    description: >
      Curated, deduplicated, location-filtered postings still live on their boards.
      The V1 output: recency-ranked links to apply to, carrying the positive
      (desired_tech_hits / title_match) and negative (deal_breaker_*) signals that
      delivery ranks on. Only the location rule removes a posting.
    # Contract enforced on the DuckDB dev target (see silver_jobs for the rationale).
    config:
      contract:
        enforced: "{{ target.type == 'duckdb' }}"
    columns:
      - name: job_key
        description: Stable posting identity (one row per posting).
        data_type: varchar
        data_tests: [not_null, unique]
      - name: content_hash
        data_type: varchar
      - name: source
        data_type: varchar
      - name: company
        data_type: varchar
      - name: title
        data_type: varchar
      - name: location
        data_type: varchar
      - name: remote_policy
        data_type: varchar
      - name: url
        description: Link out to the original posting.
        data_type: varchar
        data_tests: [not_null]
      - name: posted_or_updated_at
        data_type: timestamp
      - name: ingested_at
        data_type: timestamp
      - name: first_seen_at
        description: Earliest ingest that saw this posting ("new since last run" signal).
        data_type: timestamp
        data_tests: [not_null]
      - name: last_seen_at
        data_type: timestamp
      - name: desired_tech_hits
        description: Count of desired techs named in the posting (soft signal; sort/filter downstream).
        data_type: bigint
        data_tests: [not_null]
      - name: title_match
        description: True if the title matches a targeted role (soft signal; sort/filter downstream).
        data_type: boolean
        data_tests: [not_null]
      - name: deal_breaker_hits
        description: >
          Distinct deal-breaker techs named in the posting; 0 = clean. Negative
          signal, never a filter (ADR-0023) — delivery sorts these last.
        data_type: bigint
        data_tests: [not_null]
      - name: deal_breaker_terms
        description: Which deal-breaker terms matched (sorted, comma-separated); null when none.
        data_type: varchar
      - name: match_score
        description: >
          Best-fit ordering key, shown in the digest beside the signals that
          produced it (ADR-0024). Higher is better; may be negative.
        data_type: bigint
        data_tests: [not_null]
      - name: fit_score
        description: >
          1-5 LLM fit against the resume corpus (ADR-0027), or null when the
          posting has not been scored — extraction failed, the prompt moved, or
          the run is on the dev target. Nullable by design: the score orders
          delivery and never filters it (ADR-0020). Out-of-range values are
          nulled here rather than clamped, so a broken call cannot present as a
          confident 5.
        data_type: bigint
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: prompt_version
        description: Which rendered prompt produced fit_score; null when unscored.
        data_type: varchar
      - name: scored_at
        description: When fit_score was computed; null when unscored.
        data_type: timestamp
      - name: recency_rank
        description: 1 = most recent by posted_or_updated_at; dense unique ordering for the digest.
        data_type: bigint
        data_tests: [not_null, unique]

unit_tests:
  - name: gold_delivers_only_active_postings_ranked_by_recency
    model: fct_job_postings
    given:
      - input: ref('silver_jobs')
        rows:
          - {job_key: newer, url: "https://x/1", is_active: true,
             posted_or_updated_at: 2026-07-02 00:00:00}
          - {job_key: older, url: "https://x/2", is_active: true,
             posted_or_updated_at: 2026-06-01 00:00:00}
          - {job_key: closed, url: "https://x/3", is_active: false,
             posted_or_updated_at: 2026-07-03 00:00:00}
      - input: ref('int_jobs_scored')
        rows: []
    expect:
      rows:
        - {job_key: newer, recency_rank: 1}
        - {job_key: older, recency_rank: 2}

  - name: gold_ships_unscored_postings_with_a_null_score
    description: >
      The score orders delivery, it never filters it (ADR-0020). A posting with
      no scored row — extraction failed, the prompt moved, or the target is dev —
      must still reach gold, carrying null rather than being dropped or defaulted
      to a number that would sort it somewhere it did not earn.
    model: fct_job_postings
    given:
      - input: ref('silver_jobs')
        rows:
          - {job_key: scored, content_hash: h1, url: "https://x/1", is_active: true}
          - {job_key: unscored, content_hash: h2, url: "https://x/2", is_active: true}
      - input: ref('int_jobs_scored')
        rows:
          - {content_hash: h1, fit_score: 4, prompt_version: "1"}
    expect:
      rows:
        - {job_key: scored, fit_score: 4, prompt_version: "1"}
        - {job_key: unscored, fit_score: , prompt_version: }

  - name: gold_nulls_an_out_of_range_score_instead_of_clamping_it
    description: >
      A model returning 0 or 7 on a 1-5 rubric is a broken call, not a weak or
      strong match. Clamping would launder that into a confident number the
      digest would then display; nulling makes it indistinguishable from
      unscored, which is what it actually is.
    model: fct_job_postings
    given:
      - input: ref('silver_jobs')
        rows:
          - {job_key: too_high, content_hash: h1, url: "https://x/1", is_active: true}
          - {job_key: too_low, content_hash: h2, url: "https://x/2", is_active: true}
          - {job_key: edge_low, content_hash: h3, url: "https://x/3", is_active: true}
          - {job_key: edge_high, content_hash: h4, url: "https://x/4", is_active: true}
      - input: ref('int_jobs_scored')
        rows:
          - {content_hash: h1, fit_score: 7}
          - {content_hash: h2, fit_score: 0}
          - {content_hash: h3, fit_score: 1}
          - {content_hash: h4, fit_score: 5}
    expect:
      rows:
        - {job_key: too_high, fit_score: }
        - {job_key: too_low, fit_score: }
        - {job_key: edge_low, fit_score: 1}
        - {job_key: edge_high, fit_score: 5}
