name: Docs

# Publish the Pages site: the landing page with its market charts, the rendered
# docs and the dbt lineage (`make site`, see scripts/build_site.py). DuckDB
# target, no secrets — same fork-safe posture as ci.yml. One-time setup: repo
# Settings → Pages → Source: GitHub Actions. Actions SHA-pinned (see ingest.yml
# for rationale).
#
# Two triggers: a push to main (the code or docs changed), and a completed Ingest
# run (the market data changed). Ingest exports the aggregates as an artifact
# and this workflow draws them, so the warehouse credentials and the Pages
# permission never sit in the same workflow (ADR-0029).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Ingest]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write   # deploy-pages OIDC; unrelated to the WIF use in ingest.yml
  actions: read     # download the market-snapshot artifact from an Ingest run

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A failed Ingest run exported nothing new; the last good site stays up.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0        # the decision log dates each ADR from the commit that added it
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --extra dev --locked

      # After an Ingest run, its own snapshot -- which must exist, because the
      # export is a step of the run that just succeeded; absence is a bug and
      # fails this build. After a push, the latest successful run's snapshot; if
      # none has been kept (artifacts expire), the site still publishes without
      # charts and says so, because a docs fix should not wait on the data.
      - name: Fetch the market snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INGEST_RUN: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            gh run download "$INGEST_RUN" --repo "$GITHUB_REPOSITORY" --name market-snapshot --dir .
            exit 0
          fi
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ingest.yml --branch main \
                --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$RUN" ] || ! gh run download "$RUN" --repo "$GITHUB_REPOSITORY" \
                --name market-snapshot --dir .; then
            echo "::warning::no market snapshot available; the site publishes without charts"
          fi

      - name: Build the site (landing + docs + dbt lineage, DuckDB target)
        run: |
          make ensure-raw          # empty raw tables so the project compiles
          make site                # dbt docs generate, then scripts/build_site.py -> _site/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
